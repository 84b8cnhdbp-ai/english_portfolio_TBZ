<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="theme-color" content="#0b1020">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23a78bfa'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='700' text-anchor='middle' fill='%230b1020'%3EL%3C/text%3E%3C/svg%3E">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">L</span>
      <span>Livio <em>· English Portfolio</em></span>
    </a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false"><span></span><span></span></button>
    <nav class="nav-links">
      {% for e in site.data.entries %}
      <a href="{{ e.url | relative_url }}" style="--c: {{ e.color }}" {% if page.entry == e.n %}aria-current="page"{% endif %}>
        <b>{{ e.n }}</b> {{ e.short }}
      </a>
      {% endfor %}
    </nav>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="footer">
    <p>Made by {{ site.author }} · English at TBZ Zürich · {{ 'now' | date: '%Y' }}</p>
    <a href="#main" class="to-top">Back to top ↑</a>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
