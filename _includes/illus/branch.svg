<svg class="illus" viewBox="0 0 320 320" role="img" aria-label="If-then decision diagram">
  <defs>
    <linearGradient id="dia-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  </defs>
  <circle cx="160" cy="160" r="150" fill="rgba(255,255,255,.03)" stroke="rgba(255,255,255,.08)"/>
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path class="flow" d="M160 30 V70" stroke="#94a3b8"/>
    <path class="flow" d="M110 150 H70 V215" stroke="#fbbf24"/>
    <path class="flow" d="M210 150 H250 V215" stroke="#34d399"/>
  </g>
  <g class="float">
    <path d="M160 70 L230 150 L160 230 L90 150 Z" fill="url(#dia-g)"/>
    <text x="160" y="162" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="34" fill="#0b1020">IF</text>
  </g>
  <g class="float" style="--fd: .7s">
    <rect x="30" y="215" width="80" height="60" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="3"/>
    <text x="70" y="256" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="30" fill="#fbbf24">0</text>
  </g>
  <g class="float" style="--fd: 1.4s">
    <rect x="210" y="215" width="80" height="60" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="3"/>
    <text x="250" y="256" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="30" fill="#34d399">1</text>
  </g>
  <text x="70" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">always true</text>
  <text x="250" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">specific situation</text>
</svg>
